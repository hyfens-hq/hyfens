services:
  waypoint-fixture:
    build: .
    ports:
      - "${WAYPOINT_FIXTURE_PORT:-8080}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen(
          'http://127.0.0.1:8080/api/probe', timeout=2);
          assert response.status == 200;
          assert json.load(response)['ok'] is True
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 1s
