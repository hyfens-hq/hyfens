name: CLI release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-metadata:
    name: Validate release source
    uses: ./.github/workflows/release-checks.yml

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.architecture }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x64
          - runner: macos-15
            platform: macos
            architecture: arm64
          - runner: windows-2025
            platform: windows
            architecture: x64
          - runner: windows-11-arm
            platform: windows
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Flutter and bundled Dart
        if: matrix.architecture != 'arm64' || matrix.platform == 'macos'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.1'
      # Flutter publishes no bundled SDK archive for these ARM hosts. Its
      # source bootstrap downloads the matching native Dart SDK instead.
      - name: Check out pinned Flutter source for ARM hosts
        if: matrix.architecture == 'arm64' && matrix.platform != 'macos'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: flutter/flutter
          ref: 6655482ec06e547f90abf8ae7590466f4415978d # 3.47.1
          path: .release-flutter
          persist-credentials: false
      - name: Bootstrap native Linux ARM SDK
        if: matrix.architecture == 'arm64' && matrix.platform == 'linux'
        shell: bash
        run: |
          git -C "$GITHUB_WORKSPACE/.release-flutter" tag 3.47.1
          "$GITHUB_WORKSPACE/.release-flutter/bin/flutter" --version
          "$GITHUB_WORKSPACE/.release-flutter/bin/flutter" precache --universal
          echo "$GITHUB_WORKSPACE/.release-flutter/bin" >> "$GITHUB_PATH"
      - name: Bootstrap native Windows ARM SDK
        if: matrix.architecture == 'arm64' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          git -C "$env:GITHUB_WORKSPACE/.release-flutter" tag 3.47.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE/.release-flutter/bin/flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE/.release-flutter/bin/flutter.bat" precache --universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/.release-flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Resolve locked CLI dependencies
        working-directory: cli
        run: dart pub get --enforce-lockfile --no-example
      - name: Build native archive
        working-directory: cli
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          dart run ../scripts/cli-release/build.dart \
            --version "$RELEASE_VERSION" \
            --platform "${{ matrix.platform }}" \
            --architecture "${{ matrix.architecture }}" \
            --output-dir dist
      - name: Upload platform archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hyfens-cli-${{ matrix.platform }}-${{ matrix.architecture }}
          path: cli/dist/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Validate and assemble release assets
    needs:
      - release-metadata
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Flutter and bundled Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.1'
      - name: Resolve locked CLI dependencies
        working-directory: cli
        run: dart pub get --enforce-lockfile --no-example
      - name: Download platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hyfens-cli-*
          path: dist
          merge-multiple: true
      - name: Create checksums and artifact inventory
        working-directory: cli
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          dart run ../scripts/cli-release/inventory.dart \
            --version "$RELEASE_VERSION" \
            --artifacts-dir ../dist \
            --output ../dist/artifact-inventory.json
      - name: Verify generated checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Upload validated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-cli-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-github-release:
    name: Attest and publish GitHub Release
    needs: [release-metadata, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download validated assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-cli-release
          path: dist
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest release assets with GitHub OIDC
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "v${RELEASE_VERSION}" dist/* \
            --verify-tag \
            --title "Hyfens CLI v${RELEASE_VERSION}" \
            --generate-notes "${prerelease[@]}"
