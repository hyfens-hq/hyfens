name: Container image release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish control-plane and dashboard images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up multi-architecture emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release images
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must contain a semantic version after v: $RELEASE_TAG" >&2
            exit 1
          fi

          declared_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*$/\1/p' cli/pubspec.yaml | head -n 1)"
          if [[ "$version" != "$declared_version" ]]; then
            echo "Image tag $version does not match cli/pubspec.yaml $declared_version" >&2
            exit 1
          fi

          owner="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/$owner"
          control_image="$registry/hyfens-control-plane"
          dashboard_image="$registry/hyfens-dashboard"
          control_tags=(--tag "$control_image:$version")
          dashboard_tags=(--tag "$dashboard_image:$version")

          # Pre-releases remain opt-in; only stable tags move latest.
          if [[ "$version" != *-* ]]; then
            control_tags+=(--tag "$control_image:latest")
            dashboard_tags+=(--tag "$dashboard_image:latest")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deploy/p2/Dockerfile \
            "${control_tags[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.title=Hyfens control plane" \
            --label "org.opencontainers.image.url=https://hyfens.com" \
            --provenance=true \
            --sbom=true \
            --push .

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file dashboard/Dockerfile \
            "${dashboard_tags[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.title=Hyfens dashboard" \
            --label "org.opencontainers.image.url=https://hyfens.com" \
            --provenance=true \
            --sbom=true \
            --push .
