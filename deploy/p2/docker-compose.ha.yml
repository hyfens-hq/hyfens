name: hyfens-p2-ha

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hyfens
      POSTGRES_USER: hyfens
      POSTGRES_PASSWORD: ${HYFENS_POSTGRES_PASSWORD:?set HYFENS_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyfens -d hyfens"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - hyfens-p2-ha-postgres:/var/lib/postgresql/data

  object-store:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HYFENS_S3_ACCESS_KEY:?set HYFENS_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${HYFENS_S3_SECRET_KEY:?set HYFENS_S3_SECRET_KEY}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - hyfens-p2-ha-objects:/data

  object-bootstrap:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://object-store:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${HYFENS_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${HYFENS_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${HYFENS_S3_SECRET_KEY}
      HYFENS_S3_BUCKET: ${HYFENS_S3_BUCKET:-hyfens-artifacts}
    depends_on:
      object-store:
        condition: service_healthy

  control-plane-1:
    build:
      context: ../..
      dockerfile: deploy/p2/Dockerfile
    environment: &control-plane-environment
      HYFENS_HOST: 0.0.0.0
      HYFENS_PORT: 18081
      HYFENS_DATABASE_URL: postgresql://hyfens:${HYFENS_POSTGRES_PASSWORD}@postgres:5432/hyfens?sslmode=disable
      HYFENS_ARTIFACT_ENDPOINT: http://object-store:9000/
      HYFENS_ARTIFACT_BUCKET: ${HYFENS_S3_BUCKET:-hyfens-artifacts}
      HYFENS_ARTIFACT_ACCESS_KEY: ${HYFENS_S3_ACCESS_KEY}
      HYFENS_ARTIFACT_SECRET_KEY: ${HYFENS_S3_SECRET_KEY}
      HYFENS_ARTIFACT_REGION: ${HYFENS_S3_REGION:-us-east-1}
      HYFENS_API_BASE_PATH: ${HYFENS_API_BASE_PATH:-/}
      HYFENS_DISCOVERY_PRODUCT: ${HYFENS_DISCOVERY_PRODUCT:-hyfens}
      HYFENS_DISCOVERY_PRODUCT_VERSION: ${HYFENS_DISCOVERY_PRODUCT_VERSION:-0.1.0}
      HYFENS_DISCOVERY_API_VERSION: ${HYFENS_DISCOVERY_API_VERSION:-v1}
      HYFENS_AUTH_DEVICE_VERIFICATION_URI: ${HYFENS_AUTH_DEVICE_VERIFICATION_URI:-}
      HYFENS_AUTH_AUTHORIZATION_ENDPOINT: ${HYFENS_AUTH_AUTHORIZATION_ENDPOINT:-}
      HYFENS_WEB_ORIGINS: ${HYFENS_WEB_ORIGINS:-}
      HYFENS_PUBLIC_CONTENT_ORGANIZATION_ID: ${HYFENS_PUBLIC_CONTENT_ORGANIZATION_ID:-}
      HYFENS_AUTH_ISSUER: ${HYFENS_AUTH_ISSUER:-}
      HYFENS_AUTH_AUDIENCE: ${HYFENS_AUTH_AUDIENCE:-}
      HYFENS_AUTH_SIGNING_KEY: ${HYFENS_AUTH_SIGNING_KEY:-}
      HYFENS_AUTH_SIGNING_KEY_ID: ${HYFENS_AUTH_SIGNING_KEY_ID:-}
      HYFENS_AUTH_VERIFY_KEYS: ${HYFENS_AUTH_VERIFY_KEYS:-}
      HYFENS_AUTH_ACCESS_TTL: ${HYFENS_AUTH_ACCESS_TTL:-}
      HYFENS_AUTH_SESSION_TTL: ${HYFENS_AUTH_SESSION_TTL:-}
      HYFENS_AUTH_CODE_TTL: ${HYFENS_AUTH_CODE_TTL:-}
      HYFENS_AUTH_DEVICE_TTL: ${HYFENS_AUTH_DEVICE_TTL:-}
      HYFENS_AUTH_DEVICE_POLL_INTERVAL: ${HYFENS_AUTH_DEVICE_POLL_INTERVAL:-}
      HYFENS_AUTH_DEVICE_MAX_ATTEMPTS: ${HYFENS_AUTH_DEVICE_MAX_ATTEMPTS:-}
      HYFENS_AUTH_DEVICE_ATTEMPTS_PER_MINUTE: ${HYFENS_AUTH_DEVICE_ATTEMPTS_PER_MINUTE:-}
      HYFENS_AUTH_ALLOWED_REDIRECT_URIS: ${HYFENS_AUTH_ALLOWED_REDIRECT_URIS:-}
      HYFENS_PLATFORM_ADMIN_EMAILS: ${HYFENS_PLATFORM_ADMIN_EMAILS:-}
    healthcheck: &control-plane-healthcheck
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    depends_on: &control-plane-dependencies
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
      object-bootstrap:
        condition: service_completed_successfully

  control-plane-2:
    build:
      context: ../..
      dockerfile: deploy/p2/Dockerfile
    environment: *control-plane-environment
    healthcheck: *control-plane-healthcheck
    depends_on: *control-plane-dependencies

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HYFENS_HA_BIND_ADDRESS:-127.0.0.1}:${HYFENS_HA_PORT:-18083}:80"
    volumes:
      - ./nginx-ha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-plane-1:
        condition: service_healthy
      control-plane-2:
        condition: service_healthy

volumes:
  hyfens-p2-ha-postgres:
  hyfens-p2-ha-objects:
