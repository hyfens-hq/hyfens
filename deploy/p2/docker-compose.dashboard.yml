services:
  dashboard:
    build:
      context: ../..
      dockerfile: dashboard/Dockerfile
    environment:
      HYFENS_API_BASE: ${HYFENS_DASHBOARD_API_BASE:-http://127.0.0.1:18082/}
    ports:
      - "${HYFENS_BIND_ADDRESS:-127.0.0.1}:${HYFENS_DASHBOARD_PORT:-18083}:80"
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
