server {
  listen 80;
  server_name _;
  root /tmp/hyfens-dashboard;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
